version: '3.8'

services:
  cloud-clipboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-clipboard
    ports:
      - "${LISTEN_PORT:-9501}:9501"
    volumes:
      - cloud-clipboard-data:/app/server-node/data
    environment:
      # 基础配置
      - LISTEN_PORT=${LISTEN_PORT:-9501}
      - LISTEN_IP=${LISTEN_IP:-0.0.0.0}
      - PREFIX=${PREFIX:-}
      - MESSAGE_NUM=${MESSAGE_NUM:-100}

      # 认证配置
      - AUTH_PASSWORD=${AUTH_PASSWORD:-false}

      # 文件配置
      - FILE_EXPIRE=${FILE_EXPIRE:-3600}
      - FILE_LIMIT=${FILE_LIMIT:-104857600}
      - TEXT_LIMIT=${TEXT_LIMIT:-4096}

      # 房间配置
      - ROOM_LIST=${ROOM_LIST:-false}
      - ROOM_CLEANUP=${ROOM_CLEANUP:-3600}

      # 安全配置（新增）
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - RATE_LIMIT=${RATE_LIMIT:-100}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-200}

      # SSL 配置（可选）
      - MKCERT_DOMAIN_OR_IP=${MKCERT_DOMAIN_OR_IP:-}
      - MANUAL_KEY_PATH=${MANUAL_KEY_PATH:-}
      - MANUAL_CERT_PATH=${MANUAL_CERT_PATH:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${LISTEN_PORT:-9501}/server"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cloud-clipboard-network
    cap_add:
      - NET_ADMIN

volumes:
  cloud-clipboard-data:
    driver: local

networks:
  cloud-clipboard-network:
    driver: bridge
